<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Admin Security Test | ชาพระนคร</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f3fa;
      color: #201b24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid #e8dfee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(80 44 97 / 10%);
    }
    .eyebrow { margin: 0 0 8px; color: #76538b; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); line-height: 1.1; }
    .description { margin: 14px 0 22px; color: #685f6d; line-height: 1.6; }
    .status {
      min-height: 78px;
      padding: 16px;
      border-radius: 16px;
      background: #f6f2f8;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .status[data-kind="success"] { background: #e9f8ef; color: #17603a; }
    .status[data-kind="error"] { background: #fff0f0; color: #9d2525; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #69417f;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button + button { margin-top: 10px; }
    button:disabled { cursor: wait; opacity: .55; }
    .notice { margin: 16px 0 0; color: #756d79; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CHAPHRANAKHON · TEMPORARY TEST</p>
    <h1>ทดสอบสิทธิ์ Admin</h1>
    <p class="description">
      หน้านี้ส่ง LINE ID token ไปยัง Workflow TEST เฉพาะเมื่อกดปุ่ม
      และจะไม่แสดงหรือบันทึก token
    </p>
    <div class="status" id="status" role="status" aria-live="polite">
      กำลังเชื่อมต่อ LINE…
    </div>
    <button id="test-orders" type="button" disabled>ทดสอบอ่าน Order</button>
    <button id="test-product-validation" type="button" disabled>
      ทดสอบสิทธิ์แก้สินค้า — ไม่เขียนข้อมูล
    </button>
    <p class="notice">
      ใช้หน้านี้เฉพาะระหว่างที่ n8n กำลังรอ Test workflow
      ระบบจะส่งคำขอไปยัง webhook-test เท่านั้น
    </p>
  </main>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    (() => {
      'use strict';

      const LIFF_ID = '2010570929-BJxo68XQ';
      const TEST_URLS = Object.freeze({
        orders: 'https://n8n.n8n-kokujapan.org/webhook-test/admin-orders-security-test',
        productValidation: 'https://n8n.n8n-kokujapan.org/webhook-test/admin-product-update-security-test',
      });
      const status = document.querySelector('#status');
      const buttons = [...document.querySelectorAll('button')];
      let idToken = '';

      function show(message, kind = '') {
        status.textContent = message;
        status.dataset.kind = kind;
      }

      async function initialize() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: location.href });
            return;
          }

          idToken = liff.getIDToken() || '';
          if (!idToken) throw new Error('ไม่พบ LINE ID token กรุณาปิดแล้วเปิดจาก LINE ใหม่');

          const profile = await liff.getProfile();
          show(`พร้อมทดสอบในฐานะ ${profile.displayName || 'ผู้ดูแล'}`, 'success');
          buttons.forEach(button => { button.disabled = false; });
        } catch (error) {
          idToken = '';
          show(error?.message || 'ไม่สามารถเชื่อมต่อ LINE LIFF ได้', 'error');
        }
      }

      async function runTest(url, request, label) {
        if (!idToken) return show('ไม่พบ LINE ID token กรุณาเปิดหน้าใหม่จาก LINE', 'error');

        buttons.forEach(button => { button.disabled = true; });
        show(`กำลังส่งคำขอไปยัง ${label}…`);
        try {
          const response = await fetch(url, {
            ...request,
            headers: { ...(request.headers || {}), Authorization: `Bearer ${idToken}` },
            cache: 'no-store',
          });
          const body = await response.text();
          show(
            response.ok
              ? `สำเร็จ HTTP ${response.status} — Workflow ยืนยันสิทธิ์แล้ว`
              : `ไม่สำเร็จ HTTP ${response.status} — ${body || 'ตรวจผลใน n8n'}`,
            response.ok ? 'success' : 'error',
          );
        } catch (error) {
          show(error?.message || 'ไม่สามารถเชื่อมต่อ Workflow TEST ได้', 'error');
        } finally {
          idToken = '';
          buttons.forEach(button => { button.disabled = true; });
        }
      }

      document.querySelector('#test-orders').addEventListener('click', () => {
        runTest(TEST_URLS.orders, { method: 'GET' }, 'Workflow 13 TEST');
      });

      document.querySelector('#test-product-validation').addEventListener('click', () => {
        runTest(
          TEST_URLS.productValidation,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              productId: '',
              unit: '',
              price: -1,
              imageUrl: '',
              status: 'invalid',
              customerType: '',
            }),
          },
          'Workflow 14 TEST',
        );
      });

      initialize();
    })();
  </script>
</body>
</html>
